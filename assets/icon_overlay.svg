<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a8cff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0055d4;stop-opacity:1" />
    </linearGradient>
    <clipPath id="roundedClip">
      <rect x="0" y="0" width="200" height="200" rx="44" ry="44"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="200" height="200" rx="44" ry="44" fill="url(#bgGrad)"/>

  <g clip-path="url(#roundedClip)">
    <g transform="translate(100,90)">
      <line x1="-34" y1="30" x2="0" y2="-38" stroke="white" stroke-width="13" stroke-linecap="round"/>
      <line x1="34" y1="30" x2="0" y2="-38" stroke="white" stroke-width="13" stroke-linecap="round"/>
      <line x1="-17" y1="6" x2="17" y2="6" stroke="white" stroke-width="9" stroke-linecap="round"/>
    </g>
    <g transform="translate(100,150)">
      <line x1="0" y1="-10" x2="0" y2="8" stroke="white" stroke-width="8" stroke-linecap="round"/>
      <polyline points="-10,1 0,12 10,1" fill="none" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="-17" y1="18" x2="17" y2="18" stroke="white" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- Dark overlay -->
    <rect x="0" y="140" width="200" height="60" fill="#000000" fill-opacity="0.533"/>

    <!-- "over" text x2 size: 44px -->
    <text
      x="100"
      y="176"
      font-family="Arial, Helvetica, sans-serif"
      font-size="44"
      font-weight="700"
      fill="white"
      text-anchor="middle"
      dominant-baseline="middle"
      letter-spacing="2"
    >over</text>
  </g>

  <rect x="0" y="0" width="200" height="200" rx="44" ry="44" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
</svg>
