title: "Add iOS/tvOS icon overlay"
summary: "This step allow to print any text on top of the app's icon in order to distinguish different builds"
description: |-
  Prints a short caption at the bottom of the app icon so testers can tell
  builds apart at a glance.

  Supports both:
  - iOS `.appiconset` — every icon PNG is stamped.
  - tvOS `.brandassets` — the top-most (Front) layer of each `.imagestack`
    is stamped, so the caption sits above the composited parallax icon.
website: https://github.com/OhMyApp/bitrise-step-icon-overlay
source_code_url: https://github.com/OhMyApp/bitrise-step-icon-overlay
support_url: https://github.com/OhMyApp/bitrise-step-icon-overlay/issues
project_type_tags:
  - ios
  - tvos
type_tags:
  - utility
is_requires_admin_user: true
is_always_run: false
is_skippable: false
deps:
  brew:
  - name: imagemagick
  apt_get:
  - name: imagemagick
run_if: ""
inputs:
  - iconsbundle_name: 'AppIcon.appiconset'
    opts:
      title: "Icon bundle name"
      summary: The name of the icon bundle inside the xcasset.
      description: |-
        The name of the icon bundle including its extension.
        Use an `.appiconset` for iOS (e.g. `AppIcon.appiconset`) or a
        `.brandassets` for tvOS (e.g. `AppIcon.brandassets`).
      is_expand: true
      is_required: true
  - project_location: '.'
    opts:
      title: "Project Location"
      summary: Folder where the project and the asset files are stored in the repository.
      description: Folder where the project and the asset files are stored in the repository.
      is_expand: true
      is_required: true
  - overlay_text: '$BITRISE_GIT_COMMIT'
    opts:
      title: "Overlay text"
      summary: "The text to print over the app icon (6 characters maximum)."
      description: "The first six characters of this text will be displayed at the bottom on top of the app's icon image"
      is_expand: true
      is_required: true
  - font: "/System/Library/Fonts/Supplemental/Arial.ttf"
    opts:
      title: "Font"
      summary: "The font used for the text."
      description: "Arial by default."
      is_expand: true
      is_required: false
 
outputs:
 
